<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniSocial - Sign Up</title>

  <link rel="stylesheet" href="styles/shared/reset.css">
  <link rel="stylesheet" href="styles/shared/variables.css">
  <link rel="stylesheet" href="styles/shared/components.css">
  <link rel="stylesheet" href="styles/pages/register.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">MiniSocial</div>

      <div class="error-banner" id="js-error-banner"></div>

      <form id="js-register-form">
        <div class="auth-field">
          <label class="auth-label" for="js-username-input">Username</label>
          <input
            type="text"
            class="auth-input"
            id="js-username-input"
            placeholder="Choose a username"
            autocomplete="username"
            required
          >
        </div>

        <div class="auth-field">
          <label class="auth-label" for="js-email-input">Email (optional)</label>
          <input
            type="email"
            class="auth-input"
            id="js-email-input"
            placeholder="you@example.com"
            autocomplete="email"
          >
        </div>

        <div class="auth-field">
          <label class="auth-label" for="js-password-input">Password</label>
          <input
            type="password"
            class="auth-input"
            id="js-password-input"
            placeholder="At least 6 characters"
            autocomplete="new-password"
            required
          >
          <p class="auth-password-hint">Use at least 6 characters.</p>
        </div>

        <button type="submit" class="auth-submit-button" id="js-register-button">
          Sign Up
        </button>
      </form>

      <p class="auth-switch-text">
        Already have an account?
        <a href="login.html" class="auth-switch-link">Log in</a>
      </p>
    </div>
  </main>

  <script type="module" src="scripts/register.js"></script>
</body>
</html>
