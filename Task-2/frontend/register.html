<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Project Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/shared/base.css">
  <link rel="stylesheet" href="styles/shared/components.css">
  <link rel="stylesheet" href="styles/pages/register.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card auth-card-wide">
      <div class="brand">Project Board</div>
      <p class="subtitle">Create an account to start organizing your projects.</p>

      <div id="form-alert" class="alert alert-error" role="alert"></div>

      <form id="register-form" novalidate>
        <div class="field-row">
          <div class="field">
            <label for="first_name">First name</label>
            <input type="text" id="first_name" name="first_name" autocomplete="given-name">
          </div>
          <div class="field">
            <label for="last_name">Last name</label>
            <input type="text" id="last_name" name="last_name" autocomplete="family-name">
          </div>
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="password2">Confirm password</label>
          <input type="password" id="password2" name="password2" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-block" id="submit-btn">Create account</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script src="scripts/api.js"></script>
  <script src="scripts/register.js"></script>
</body>
</html>
