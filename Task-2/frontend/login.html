<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Project Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/shared/base.css">
  <link rel="stylesheet" href="styles/shared/components.css">
  <link rel="stylesheet" href="styles/pages/login.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand">Project Board</div>
      <p class="subtitle">Log in to see your projects and tasks.</p>

      <div id="form-alert" class="alert alert-error" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-block" id="submit-btn">Log in</button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="register.html">Create one</a></p>
    </div>
  </div>

  <script src="scripts/api.js"></script>
  <script src="scripts/login.js"></script>
</body>
</html>
